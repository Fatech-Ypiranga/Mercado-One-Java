name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Docker do runner habilita PostgresMigrationTests (Flyway + validate em PostgreSQL real).
      - run: mvn -B test

  pdv-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
