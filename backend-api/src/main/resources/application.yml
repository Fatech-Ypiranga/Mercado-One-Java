server:
  port: ${PORT:${MERCADO_ONE_API_PORT:8080}}

spring:
  application:
    name: mercado-one-backend-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${MERCADO_ONE_DATABASE_URL:jdbc:postgresql://${MERCADO_ONE_DB_HOST:localhost}:${MERCADO_ONE_DB_PORT:5432}/${MERCADO_ONE_DB_NAME:mercado_one}}
    username: ${MERCADO_ONE_DB_USER:mercado_one}
    password: ${MERCADO_ONE_DB_PASSWORD:mercado_one_dev}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

mercado-one:
  sales:
    operator-max-discount-percent: ${MERCADO_ONE_OPERATOR_MAX_DISCOUNT_PERCENT:0}
  security:
    jwt-secret: ${MERCADO_ONE_JWT_SECRET}
    jwt-expiration-minutes: ${MERCADO_ONE_JWT_EXPIRATION_MINUTES:480}
    cors-allowed-origins: ${MERCADO_ONE_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    cookie-secure: ${MERCADO_ONE_COOKIE_SECURE:false}
    seed-admin:
      enabled: ${MERCADO_ONE_SEED_ADMIN_ENABLED:false}
      name: ${MERCADO_ONE_SEED_ADMIN_NAME:}
      login: ${MERCADO_ONE_SEED_ADMIN_LOGIN:}
      password: ${MERCADO_ONE_SEED_ADMIN_PASSWORD:}

  # Redefinicao de senha por e-mail. Sem MERCADO_ONE_MAIL_HOST e MERCADO_ONE_MAIL_FROM o envio fica desligado.
  mail:
    host: ${MERCADO_ONE_MAIL_HOST:}
    port: ${MERCADO_ONE_MAIL_PORT:587}
    username: ${MERCADO_ONE_MAIL_USER:}
    password: ${MERCADO_ONE_MAIL_PASSWORD:}
    from: ${MERCADO_ONE_MAIL_FROM:}
    starttls: ${MERCADO_ONE_MAIL_STARTTLS:true}
  password-reset:
    app-url: ${MERCADO_ONE_APP_URL:http://localhost:4200}
    token-minutes: ${MERCADO_ONE_PASSWORD_RESET_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
