<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframe do Shell Administrativo - Mercado One</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --rule: #d9dbe2;
      --white: #ffffff;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 20px;
      max-width: 900px;
    }
    .frame {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
    }
    .node-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .node-body {
      fill: var(--muted);
      font-size: 13px;
    }
    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }
    .note {
      fill: var(--muted);
      font-size: 13px;
    }
    .tag {
      fill: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .edge-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .label-bg {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }
    .arrow {
      fill: none;
      stroke: var(--link);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dash {
      fill: none;
      stroke: var(--soft);
      stroke-width: 2;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire {
      fill: var(--white);
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-soft {
      fill: #eef2f7;
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-accent {
      fill: #fff0e8;
      stroke: var(--accent);
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Wireframe</div>
    <h1>Wireframe do Shell Administrativo</h1>
    <p>Estrutura inicial de navegação, barra superior, indicadores e área principal do Admin Web.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="09-wireframe-shell-admin-title 09-wireframe-shell-admin-desc" viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg">
        <title id="09-wireframe-shell-admin-title">Wireframe do Shell Administrativo</title>
        <desc id="09-wireframe-shell-admin-desc">Estrutura inicial de navegação, barra superior, indicadores e área principal do Admin Web.</desc>
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#2e5aa8"/>
          </marker>
          <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#7a8399"/>
          </marker>
        </defs>
<rect x="56" y="72" width="1008" height="584" rx="8" class="wire"/>
<rect x="56" y="72" width="220" height="584" rx="8" class="wire-soft"/>
<rect x="276" y="72" width="788" height="72" class="wire"/>
<text x="166" y="120" class="label" text-anchor="middle">Menu lateral</text>
<text x="670" y="116" class="label" text-anchor="middle">Barra superior: título, perfil e sair</text>
<rect x="316" y="176" width="700" height="72" rx="8" class="wire-accent"/>
<text x="666" y="220" class="label" text-anchor="middle">Resumo da tela atual</text>
<rect x="88" y="180" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="204" class="note" text-anchor="middle">Início</text>
<rect x="88" y="236" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="260" class="note" text-anchor="middle">Usuários</text>
<rect x="88" y="292" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="316" class="note" text-anchor="middle">Produtos</text>
<rect x="88" y="348" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="372" class="note" text-anchor="middle">Estoque</text>
<rect x="88" y="404" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="428" class="note" text-anchor="middle">Vendas</text>
<rect x="88" y="460" width="156" height="36" rx="6" class="wire"/>
<text x="166" y="484" class="note" text-anchor="middle">Offline</text>
<rect x="316" y="280" width="136" height="92" rx="8" class="wire-soft"/>
<text x="384" y="332" class="note" text-anchor="middle">Indicador 1</text>
<rect x="504" y="280" width="136" height="92" rx="8" class="wire-soft"/>
<text x="572" y="332" class="note" text-anchor="middle">Indicador 2</text>
<rect x="692" y="280" width="136" height="92" rx="8" class="wire-soft"/>
<text x="760" y="332" class="note" text-anchor="middle">Indicador 3</text>
<rect x="880" y="280" width="136" height="92" rx="8" class="wire-soft"/>
<text x="948" y="332" class="note" text-anchor="middle">Indicador 4</text>
<rect x="316" y="408" width="700" height="184" rx="8" class="wire"/>
<text x="666" y="456" class="label" text-anchor="middle">Área principal: tabela, formulário ou painel</text>
<text x="666" y="504" class="note" text-anchor="middle">layout responsivo</text>
<text x="666" y="524" class="note" text-anchor="middle">estados de vazio, carregamento e erro</text>
      </svg>
    </div>
  </main>
</body>
</html>
