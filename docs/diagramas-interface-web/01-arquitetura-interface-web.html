<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquitetura da Interface Web - Mercado One</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --rule: #d9dbe2;
      --white: #ffffff;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 20px;
      max-width: 900px;
    }
    .frame {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
    }
    .node-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .node-body {
      fill: var(--muted);
      font-size: 13px;
    }
    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }
    .note {
      fill: var(--muted);
      font-size: 13px;
    }
    .tag {
      fill: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .edge-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .label-bg {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }
    .arrow {
      fill: none;
      stroke: var(--link);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dash {
      fill: none;
      stroke: var(--soft);
      stroke-width: 2;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire {
      fill: var(--white);
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-soft {
      fill: #eef2f7;
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-accent {
      fill: #fff0e8;
      stroke: var(--accent);
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Arquitetura</div>
