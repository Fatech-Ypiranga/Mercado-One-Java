<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframe de Relatórios e Conflitos - Mercado One</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --rule: #d9dbe2;
      --white: #ffffff;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 20px;
      max-width: 900px;
    }
    .frame {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
    }
    .node-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .node-body {
      fill: var(--muted);
      font-size: 13px;
    }
    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }
    .note {
      fill: var(--muted);
      font-size: 13px;
    }
    .tag {
      fill: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .edge-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .label-bg {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }
    .arrow {
      fill: none;
      stroke: var(--link);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dash {
      fill: none;
      stroke: var(--soft);
      stroke-width: 2;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire {
      fill: var(--white);
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-soft {
      fill: #eef2f7;
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-accent {
      fill: #fff0e8;
      stroke: var(--accent);
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Wireframe</div>
    <h1>Wireframe de Relatórios e Conflitos</h1>
    <p>Modelo inicial para telas de vendas, dashboard e conflitos offline com filtros, métricas e detalhe.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="11-wireframe-relatorios-conflitos-title 11-wireframe-relatorios-conflitos-desc" viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg">
        <title id="11-wireframe-relatorios-conflitos-title">Wireframe de Relatórios e Conflitos</title>
        <desc id="11-wireframe-relatorios-conflitos-desc">Modelo inicial para telas de vendas, dashboard e conflitos offline com filtros, métricas e detalhe.</desc>
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#2e5aa8"/>
          </marker>
          <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#7a8399"/>
          </marker>
        </defs>
<rect x="56" y="72" width="1008" height="584" rx="8" class="wire"/>
<rect x="96" y="112" width="920" height="72" rx="8" class="wire-soft"/>
<text x="556" y="156" class="label" text-anchor="middle">Filtros: período, status, produto e operador</text>
<rect x="96" y="216" width="176" height="96" rx="8" class="wire-accent"/>
<text x="184" y="268" class="note" text-anchor="middle">Total de vendas</text>
<rect x="324" y="216" width="176" height="96" rx="8" class="wire-accent"/>
<text x="412" y="268" class="note" text-anchor="middle">Ticket médio</text>
<rect x="552" y="216" width="176" height="96" rx="8" class="wire-accent"/>
<text x="640" y="268" class="note" text-anchor="middle">Itens críticos</text>
<rect x="780" y="216" width="176" height="96" rx="8" class="wire-accent"/>
<text x="868" y="268" class="note" text-anchor="middle">Conflitos</text>
<rect x="96" y="352" width="592" height="224" rx="8" class="wire"/>
<text x="392" y="396" class="label" text-anchor="middle">Tabela de vendas ou conflitos</text>
<rect x="720" y="352" width="296" height="224" rx="8" class="wire-soft"/>
<text x="868" y="396" class="label" text-anchor="middle">Detalhe selecionado</text>
<text x="868" y="444" class="note" text-anchor="middle">ação: resolver</text>
<text x="868" y="464" class="note" text-anchor="middle">ação: exportar</text>
<text x="868" y="484" class="note" text-anchor="middle">ação: revisar</text>
<path d="M 128 436 L 656 436" class="line"/>
<path d="M 128 480 L 656 480" class="line"/>
<path d="M 128 524 L 656 524" class="line"/>
      </svg>
    </div>
  </main>
</body>
</html>
