<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produto e Categoria - Mercado One</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --rule: #d9dbe2;
      --white: #ffffff;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 20px;
      max-width: 900px;
    }
    .frame {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
    }
    .node-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .node-body {
      fill: var(--muted);
      font-size: 13px;
    }
    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }
    .note {
      fill: var(--muted);
      font-size: 13px;
    }
    .tag {
      fill: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .edge-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .label-bg {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }
    .arrow {
      fill: none;
      stroke: var(--link);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dash {
      fill: none;
      stroke: var(--soft);
      stroke-width: 2;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire {
      fill: var(--white);
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-soft {
      fill: #eef2f7;
      stroke: var(--rule);
      stroke-width: 2;
    }
    .wire-accent {
      fill: #fff0e8;
      stroke: var(--accent);
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Fluxograma</div>
    <h1>Cadastro de Produto e Categoria</h1>
    <p>Fluxo de trabalho para manter catálogo no Admin Web antes de disponibilizar produtos ao PDV.</p>
    <div class="frame">

        <title id="05-fluxo-cadastro-produto-categoria-title">Cadastro de Produto e Categoria</title>
        <desc id="05-fluxo-cadastro-produto-categoria-desc">Fluxo de trabalho para manter catálogo no Admin Web antes de disponibilizar produtos ao PDV.</desc>

            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#2e5aa8"/>
          </marker>
          <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 2 2 L 10 6 L 2 10 Z" fill="#7a8399"/>
          </marker>
        </defs>
<path d="M 164 180 L 260 180" class="arrow" marker-end="url(#arrow)"/>

<rect x="378" y="452" width="116" height="24" rx="6" class="label-bg"/>

<text x="106" y="186" class="node-title" text-anchor="middle">Início</text>
<rect x="260" y="128" width="192" height="104" rx="8" fill="#ffffff" stroke="#d9dbe2" stroke-width="2"/>
<text x="356" y="160" class="node-title" text-anchor="middle">Abrir Catálogo</text>
<text x="356" y="188" class="node-body" text-anchor="middle">/produtos ou</text>
<text x="356" y="208" class="node-body" text-anchor="middle">/categorias</text>

<text x="684" y="160" class="node-title" text-anchor="middle">Editar Dados</text>
<text x="684" y="188" class="node-body" text-anchor="middle">nome, preço</text>
<text x="684" y="208" class="node-body" text-anchor="middle">categoria, status</text>
<rect x="920" y="152" width="136" height="56" rx="28" fill="#ffffff" stroke="#d9dbe2" stroke-width="2"/>

<text x="356" y="324" class="node-body" text-anchor="middle">verificar antes</text>
<text x="356" y="344" class="node-body" text-anchor="middle">do produto</text>
<rect x="520" y="312" width="168" height="84" rx="8" fill="#ffffff" stroke="#d9dbe2" stroke-width="2"/>
<text x="604" y="344" class="node-title" text-anchor="middle">Validar</text>
<text x="604" y="372" class="node-body" text-anchor="middle">campos obrigatórios</text>

<rect x="852" y="312" width="168" height="84" rx="8" fill="#ffffff" stroke="#d9dbe2" stroke-width="2"/>
<text x="936" y="344" class="node-title" text-anchor="middle">Publicar</text>
<text x="936" y="372" class="node-body" text-anchor="middle">produto ativo</text>
<text x="936" y="392" class="node-body" text-anchor="middle">disponível ao PDV</text>
<rect x="520" y="456" width="168" height="84" rx="8" fill="#eef2f7" stroke="#d9dbe2" stroke-width="2"/>
<text x="604" y="488" class="node-title" text-anchor="middle">Erro</text>
<text x="604" y="516" class="node-body" text-anchor="middle">mensagem inline</text>
<text x="604" y="536" class="node-body" text-anchor="middle">mantém formulário</text>
      </svg>
    </div>
  </main>
</body>
</html>
